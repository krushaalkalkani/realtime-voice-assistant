[project]
name = "realtime-voice-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.164.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "onnxruntime>=1.32.0",
    "piper-tts>=1.8.0",
    "pydantic>=2.14.3",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
